# ══════════════════════════════════════════════════
# Programmatic SEO Content Hub — Configuration
# Niche: Remote Work & Digital Nomad
# ══════════════════════════════════════════════════

site:
  title: "Remote Work Hub"
  tagline: "Curated tools, tips & gear for the modern remote workforce"
  domain: "workremotehub.com"
  base_url: "https://workremotehub.com"
  language: "en"
  locale: "en_US"

  # Persona for content voice
  persona:
    name: "Alex"
    tone: "practical, confident, slightly conversational"
    expertise: "5+ years remote work experience, former office convert"
    audience: "remote workers, freelancers, digital nomads, hybrid employees"

  monetization:
    amazon_tag: "remotework-20"          # Your Amazon affiliate tag
    affiliate_programs:
      - name: "Amazon Associates"
        enabled: true
        tag_var: "tag"
      - name: "Impact Radius / CJ"       # For SaaS affiliates
        enabled: false
      - name: "Direct SaaS"             # Notion, Zapier, etc.
        enabled: false

pipeline:
  # Content generation schedule
  articles_per_week: 7                   # 1 per day
  articles_per_batch: 7                  # How many to generate per cron run
  min_word_count: 1200
  max_word_count: 2500

  # Ollama settings
  llm:
    provider: "ollama"                   # ollama | openrouter
    model: "tinyllama:latest"            # faster than llama3.2 for CPU
    endpoint: "http://localhost:11434"
    temperature: 0.7
    max_tokens: 2000

  # Keyword sources
  keywords:
    seed_list: [
      "best headphones for remote work",
      "ergonomic office chair under 300",
      "standing desk converter review",
      "noise cancelling microphone for zoom calls",
      "best monitor for laptop setup",
      "wifi extender for home office",
      "best webcam for remote meetings",
      "laptop stand for desk",
      "mechanical keyboard for programming",
      "USB-C hub for macbook",
      "best mouse for ergonomics",
      "desk lamp for eye strain",
      "cable management for desk",
      "surge protector for home office",
      "portable monitor for travel",
      "best backpack for laptop commute",
      "coffee maker for home office",
      "ring light for video calls",
      "bluetooth speaker for focus music",
      "pomodoro timer for productivity",
    ]

    # Topic clusters for interlinking
    clusters:
      - name: "home-office-setup"
        keywords: [desk, chair, monitor, lighting, cable management, ergonomics]
      - name: "remote-work-tools"
        keywords: [software, app, tool, platform, zoom, slack, notion, asana]
      - name: "productivity"
        keywords: [focus, time management, routine, pomodoro, deep work]
      - name: "digital-nomad"
        keywords: [travel, portable, backpack, co-working, wifi, vpn]

  # Interlinking rules
  interlinking:
    min_links_per_article: 3
    max_links_per_article: 6
    link_to_same_cluster: true
    link_to_high_authority_first: true

seo:
  # Auto-generated meta
  title_template: "{keyword} — Remote Work Hub Reviews & Guides"
  description_template: "Looking for {keyword}? Our expert guide covers the top picks, honest reviews, and practical tips for remote workers and digital nomads."

  # Schema.org types
  schema_types:
    article: "Article"
    review: "Product"        # For review-type content
    list: "ItemList"         # For roundup/best-of content

  # Sitemap
  sitemap:
    enabled: true
    changefreq: "weekly"
    priority:
      homepage: 1.0
      articles: 0.8
      categories: 0.5

monitoring:
  broken_link_check_interval_days: 7
  stale_content_threshold_days: 180     # Refresh articles older than this
  rank_check_interval_days: 14