# ══════════════════════════════════════════════════
# Crypto Burn Analytics Dashboard — Configuration
# Niche: Token Burn Tracking & Analytics
# ══════════════════════════════════════════════════

site:
  title: "Burniqo"
  tagline: "Real-time token burn tracking and crypto deflation analytics"
  domain: "burniqo.com"
  base_url: "https://burniqo.com"
  language: "en"
  locale: "en_US"

  # Persona for content voice
  persona:
    name: "Burniqo AI"
    tone: "data-driven, concise, analytical"
    expertise: "Blockchain forensics and deflationary tokenomics"
    audience: "crypto investors, token holders, DeFi analysts"

  monetization:
    affiliate_programs:
      - name: "Bitget"
        referral_code: "GU9J7F2P"

pipeline:
  # Content generation schedule
  articles_per_week: 7                   # 1 per day
  articles_per_batch: 7                  # How many to generate per cron run
  min_word_count: 1200
  max_word_count: 2500

  # Ollama settings
  llm:
    provider: "ollama"                   # ollama | openrouter
    model: "tinyllama:latest"            # faster than llama3.2 for CPU
    endpoint: "http://localhost:11434"
    temperature: 0.7
    max_tokens: 1000

  # Keyword sources
  keywords:
    seed_list: [
      "top token burns today",
      "deflationary token list 2026",
      "how to track token burns",
      "BNB chain burn rate",
      "Ethereum burn rate real-time",
      "SHIB burn tracker",
      "best burn trackers 2026",
      "impact of token burning on price",
      "top burning coins on Polygon",
      "Solana burn statistics",
      "burn mechanism explained",
      "tokenomics of deflation",
      "most burned tokens of all time",
      "crypto burn alerts",
      "burniqo burn analytics",
    ]

    # Topic clusters for interlinking
    clusters:
      - name: "burn-mechanics"
        keywords: [burn, deflation, tokenomics, supply, mechanism]
      - name: "chain-analytics"
        keywords: [BNB, Ethereum, Polygon, Solana, Avalanche]
      - name: "token-tracking"
        keywords: [SHIB, USDT, USDC, DAI, LUNC]
      - name: "investor-guides"
        keywords: [analytics, guide, tutorial, strategy, price-impact]

  # Interlinking rules
  interlinking:
    min_links_per_article: 3
    max_links_per_article: 6
    link_to_same_cluster: true
    link_to_high_authority_first: true

seo:
  # Auto-generated meta
  title_template: "{keyword} — Burniqo Burn Analytics"
  description_template: "Track {keyword} in real-time. Burniqo provides deep insights into token burns, deflation rates, and supply reduction across all major chains."

  # Schema.org types
  schema_types:
    article: "Article"
    review: "Product"        # For review-type content
    list: "ItemList"         # For roundup/best-of content

  # Sitemap
  sitemap:
    enabled: true
    changefreq: "weekly"
    priority:
      homepage: 1.0
      articles: 0.8
      categories: 0.5

monitoring:
  broken_link_check_interval_days: 7
  stale_content_threshold_days: 180     # Refresh articles older than this
  rank_check_interval_days: 14
